services:
  redis:
    image: redis:7-alpine
    container_name: dirtyrss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lfu
      --save ""
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --activedefrag yes
      --active-defrag-ignore-bytes 100mb
      --active-defrag-threshold-lower 10
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
    profiles:
      - redis

  dirtyrss:
    build: .
    container_name: dirtyrss
    restart: unless-stopped
    # Tope del contenedor completo (Node con heap de 768 MB + yt-dlp/ffmpeg/sharp hijos)
    mem_limit: 1536m
    mem_reservation: 512m
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CACHE_TYPE=redis
      - REDIS_ADDRESS=redis:6379
      - YTDLP_MAX_CONCURRENT=8
      - YTDLP_MAX_CONCURRENT_HEAVY=2
      - YTDLP_MAX_PENDING_HEAVY=50
      # info (default) | debug: activa logs por request ([MEMORY]) y por video ([VIDEO])
      - LOG_LEVEL=info
    # Rotación de logs: evita que el json-file crezca sin límite
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - dirtyrss-data:/tmp/public
    profiles:
      - ""
      - redis

volumes:
  redis-data:
  dirtyrss-data:
