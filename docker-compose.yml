services:
  redis:
    image: redis:7-alpine
    container_name: dirtyrss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    profiles:
      - redis

  dirtyrss:
    build: .
    container_name: dirtyrss
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CACHE_TYPE=${CACHE_TYPE:-memory}
      - REDIS_ADDRESS=${REDIS_ADDRESS:-redis:6379}
    volumes:
      - dirtyrss-data:/tmp/public
    profiles:
      - ""
      - redis

volumes:
  redis-data:
  dirtyrss-data:
